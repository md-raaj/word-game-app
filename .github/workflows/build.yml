name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Upgrade Cython and Buildozer dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install --upgrade cython==0.29.36 virtualenv

    # আগের কোনো ত্রুটিপূর্ণ ক্যাশ যেন না থাকে, তাই ফ্রেশ বিল্ড করা হবে
    - name: Clean up old buildozer cache
      run: rm -rf ~/.buildozer

    - name: Build with Buildozer (Native)
      run: |
        pip install buildozer
        yes | buildozer -v android debug || true
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
